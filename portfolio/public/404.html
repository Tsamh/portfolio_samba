<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404</title>
    <script>
      /* Static hosts (GitHub Pages…) serve this file for every unknown
         address. Send the visitor to the app, which shows its own 404. */
      var base = location.pathname.replace(/\/[^/]*$/, '/');
      location.replace(base + '#/404');
    </script>
  </head>
  <body>
    <noscript><a href="/">404. Back to the site</a></noscript>
  </body>
</html>
