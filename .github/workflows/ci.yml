# Tests and builds the site on every push to main, then publishes it on
# GitHub Pages: https://tsamh.github.io/portfolio_samba/
#
# One-time setting: Settings > Pages > Build and deployment > Source must be
# "GitHub Actions".
name: CI & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a newer push replaces a publish still waiting, never one already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci
      - run: npm test

      # VITE_SOON keeps the Extra and Random pages as placeholders: their
      # photos are not in this repository and their write-ups stay out of the
      # bundle. BASE_PATH: Pages serves the site from /portfolio_samba/.
      - run: npm run build
        env:
          VITE_SOON: '1'
          BASE_PATH: /portfolio_samba/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
